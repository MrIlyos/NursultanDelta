name: Build Minecraft Forge 1.8.9 mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 2.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.7'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NursultanDelta-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
